name: pre-commit
on: pull_request

jobs:
  pre-commit:
    uses: llm-d/llm-d-infra/.github/workflows/reusable-pre-commit.yaml@main
    permissions:
      contents: read

  nightly-validation-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s tests -v
