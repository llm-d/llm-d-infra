# Reusable Prow Remove LGTM workflow
# Removes the 'lgtm' label when a PR is updated
#
# Usage in consuming repo:
#   name: Prow Remove LGTM
#   on: pull_request
#   jobs:
#     remove-lgtm:
#       uses: llm-d/llm-d-infra/.github/workflows/reusable-prow-remove-lgtm.yaml@main

name: Prow Remove LGTM (Reusable)

on:
  workflow_call:

jobs:
  execute:
    # Dependabot runs get a read-only token on pull_request, which the action's writes cannot use.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: jpmcb/prow-github-actions@v3.0.1
        with:
          jobs: lgtm
          github-token: '${{ secrets.GITHUB_TOKEN }}'
