# Generated output — excluded from every hook.
# Regenerate via gh-aw from .github/workflows/upstream-monitor.md instead of editing.
exclude: '^\.github/workflows/upstream-monitor\.lock\.yml$'

repos:
  # general pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allows custom YAML tags used in k8s
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict

  # GitHub Actions workflow linting
  # check-yaml proves a workflow parses; actionlint proves it is a valid
  # workflow — bad ${{ }} expressions, unknown inputs, invalid uses/needs.
  # Runs with the bundled shellcheck integration fully enabled: the backlog it
  # originally reported was fixed rather than suppressed, so no -ignore or
  # -shellcheck= args are needed here.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
